{
  "schema_version": 1,
  "application": { "id": "playiku", "name": "Playiku", "family": "ishiku", "locale": "en" },
  "summary": "A self-hosted, mobile-first library of polished casual browser games with private per-user progress.",
  "requirements": [
    { "id": "PLAT-001", "title": "Operational health", "priority": "critical", "acceptance": ["Liveness and readiness endpoints reflect process and database health.", "Configuration is validated before the server accepts traffic."], "security_critical": false },
    { "id": "AUTH-001", "title": "Private account access", "priority": "critical", "acceptance": ["First run creates one administrator using a single-use setup secret and a distinct password.", "Accounts use Argon2id and revocable server sessions in secure cookies.", "Invalid credentials are generic and rate limited, and mutations require CSRF proof."], "security_critical": true },
    { "id": "SHELL-001", "title": "Responsive game library", "priority": "critical", "acceptance": ["The home route presents Continue, Favorites, Games, and Recent sections where data exists.", "The game grid is touch friendly and adapts from compact phones to large desktops.", "The standard profile menu reaches Profile, Statistics, Settings, Theme, About, and Logout."], "security_critical": false },
    { "id": "THEME-001", "title": "Ishiku themes", "priority": "high", "acceptance": ["Violet, ocean, forest, sunset, rose, and mono themes support light and dark modes.", "Theme and motion preferences persist per account."], "security_critical": false },
    { "id": "GAME-001", "title": "Modular game contract", "priority": "critical", "acceptance": ["Each game registers id, name, description, category, icon, component, and new-game behavior in one manifest.", "Adding a game does not require edits throughout unrelated shell code."], "security_critical": false },
    { "id": "SDKU-001", "title": "Sudoku", "priority": "critical", "acceptance": ["Sudoku offers Easy, Medium, Hard, and Expert puzzles with a unique solution.", "Keyboard and touch input, notes, undo, redo, hint, pause, timer, highlighting, and resume are available."], "security_critical": false },
    { "id": "MINE-001", "title": "Minesweeper", "priority": "critical", "acceptance": ["Beginner, intermediate, expert, and bounded custom boards are supported.", "The first opened cell is safe, and flag, chord, long-press, timer, counter, and same-board restart controls work."], "security_critical": false },
    { "id": "G2048-001", "title": "2048", "priority": "critical", "acceptance": ["Arrow, WASD, and swipe input apply canonical merge and score rules.", "Undo, best score, smooth movement, resume, and continue-after-2048 behavior are available."], "security_critical": false },
    { "id": "NONO-001", "title": "Nonogram", "priority": "critical", "acceptance": ["Deterministic 5x5, 10x10, and 15x15 picture puzzles are available.", "Fill, mark-empty, undo, redo, hint, timer, completed-line feedback, and resume work."], "security_critical": false },
    { "id": "SNAKE-001", "title": "Snake", "priority": "critical", "acceptance": ["Keyboard, swipe, and optional directional controls move the snake without page reloads.", "Score, increasing speed, pause, instant restart, and multiple board sizes work."], "security_critical": false },
    { "id": "SOL-001", "title": "Klondike Solitaire", "priority": "critical", "acceptance": ["Draw-one and draw-three Klondike deals enforce legal tableau, stock, waste, and foundation moves.", "Pointer drag, tap-to-move, double-click foundation, undo, new deal, resume, timer, and move count work."], "security_critical": false },
    { "id": "DATA-001", "title": "Private game data", "priority": "critical", "acceptance": ["Favorites, settings, active sessions, statistics, daily results, and achievements are isolated per account.", "Persisted JSON payloads are schema and size validated on the server.", "Users can delete their game history and statistics."], "security_critical": true },
    { "id": "DAILY-001", "title": "Daily challenges", "priority": "high", "acceptance": ["Sudoku, Minesweeper, 2048, and Nonogram expose a deterministic daily seed for the configured instance date.", "Daily results and streaks are stored per account without limiting normal games."], "security_critical": false },
    { "id": "A11Y-001", "title": "Accessible play", "priority": "critical", "acceptance": ["Navigation and game controls have visible focus, accessible names, and keyboard operation where mechanics permit.", "State does not rely on color alone and layouts support zoom without horizontal page scrolling.", "Reduced motion disables non-essential transitions."], "security_critical": false },
    { "id": "PWA-001", "title": "Installable offline shell", "priority": "high", "acceptance": ["A web app manifest and service worker make the static shell installable.", "Supported games remain reachable from the cached shell while temporarily offline."], "security_critical": false },
    { "id": "META-001", "title": "Build identity and licenses", "priority": "high", "acceptance": ["About shows version, build date, Git SHA, license, and repository information.", "Third-party license information ships with the application."], "security_critical": false },
    { "id": "DEPLOY-001", "title": "Hardened self-hosting", "priority": "critical", "acceptance": ["The image runs as non-root with a read-only root filesystem and only /data writable.", "The primary Compose follows the ZimaOS contract with fixed port 8514, /DATA/AppData persistence, CasaOS metadata, runtime setup secret, and a health check.", "Documented backup, restore, upgrade, and rollback procedures preserve SQLite data."], "security_critical": true }
  ]
}
