name: Playiku promote release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: playiku-promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      source-image: ${{ steps.resolve.outputs.source-image }}
      source-digest: ${{ steps.resolve.outputs.source-digest }}
      release-run-url: ${{ steps.wait.outputs.release-run-url }}
    steps:
      - name: Wait for the verified immutable release image
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            run_json="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ishiku-release-release.yml/runs?event=push&head_sha=${GITHUB_SHA}&per_page=10")"
            run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"${run_json}")"

            if [[ -z "${run_id}" ]]; then
              sleep 10
              continue
            fi

            status="$(jq -r '.workflow_runs[0].status' <<<"${run_json}")"
            conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' <<<"${run_json}")"
            run_url="$(jq -r '.workflow_runs[0].html_url' <<<"${run_json}")"

            if [[ "${status}" == "completed" ]]; then
              if [[ "${conclusion}" != "success" ]]; then
                echo "The immutable release workflow failed: ${run_url}" >&2
                exit 1
              fi

              echo "release-run-url=${run_url}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for the immutable release workflow." >&2
          exit 1

      - name: Log in to GHCR for scanning
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve immutable image digest
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          source_image="${image}:${GITHUB_REF_NAME}"
          source_digest="$(docker buildx imagetools inspect "${source_image}" | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)"

          if [[ ! "${source_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve an immutable digest for ${source_image}." >&2
            exit 1
          fi

          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "source-image=${source_image}" >> "${GITHUB_OUTPUT}"
          echo "source-digest=${source_digest}" >> "${GITHUB_OUTPUT}"
          echo "image-ref=${source_image}@${source_digest}" >> "${GITHUB_OUTPUT}"

      - name: Scan immutable image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.resolve.outputs.image-ref }}
          format: sarif
          output: playiku-vulnerability-report.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.resolve.outputs.image-ref }}
          format: spdx-json
          output: playiku-sbom.spdx.json
          exit-code: '0'

      - name: Store immutable release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playiku-release-evidence-${{ github.run_id }}
          path: |
            playiku-sbom.spdx.json
            playiku-vulnerability-report.sarif
          if-no-files-found: error
          retention-days: 30

  promote:
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      IMAGE: ${{ needs.scan.outputs.image }}
      SOURCE_IMAGE: ${{ needs.scan.outputs.source-image }}
      SOURCE_DIGEST: ${{ needs.scan.outputs.source-digest }}
      RELEASE_RUN_URL: ${{ needs.scan.outputs.release-run-url }}
    steps:
      - name: Restore immutable release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: playiku-release-evidence-${{ github.run_id }}

      - name: Log in to GHCR for promotion
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Promote the verified digest to latest
        shell: bash
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}@${SOURCE_DIGEST}"

          latest_digest="$(docker buildx imagetools inspect "${IMAGE}:latest" | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)"
          if [[ "${latest_digest}" != "${SOURCE_DIGEST}" ]]; then
            echo "latest does not resolve to the verified release digest." >&2
            exit 1
          fi

      - name: Publish GitHub release and immutable evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<EOF
          ## Playiku ${version}

          First public release of Playiku: six self-hosted casual games, per-user progress and statistics, daily challenges, achievements, six themes, and an installable offline-capable PWA.

          ### Deployment

          - Image: \`${SOURCE_IMAGE}\`
          - Digest: \`${SOURCE_DIGEST}\`
          - ZimaOS Compose image: \`${IMAGE}:latest\` (the same verified digest)
          - Persistent data: \`/DATA/AppData/i_playiku/Data\` on the host and \`/data\` in the container
          - Compatibility: amd64, ZimaOS-first deployment, fixed host port 8514

          Replace the setup-secret placeholder in \`compose.yaml\` with at least 32 unique random characters before first start.

          ### Verification and supply chain

          The complete ishiku verification gate, browser matrix, container build, high/critical vulnerability scan, OCI SBOM, and provenance attestation passed before promotion. The SPDX SBOM and vulnerability report are attached to this release.

          Immutable release workflow: ${RELEASE_RUN_URL}

          ### Backup and rollback

          Back up the complete data directory before every update. Roll back by pinning \`${SOURCE_IMAGE}@${SOURCE_DIGEST}\`; restore the matching pre-upgrade data backup if a future release declares a schema migration.
          EOF

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Playiku ${version}" \
              --notes-file release-notes.md
            gh release upload "${GITHUB_REF_NAME}" \
              playiku-sbom.spdx.json \
              playiku-vulnerability-report.sarif \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              playiku-sbom.spdx.json \
              playiku-vulnerability-report.sarif \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --target "${GITHUB_SHA}" \
              --title "Playiku ${version}" \
              --notes-file release-notes.md
          fi

          {
            echo "## Playiku ${version} published"
            echo
            echo "- Image: \`${SOURCE_IMAGE}\`"
            echo "- Digest: \`${SOURCE_DIGEST}\`"
            echo "- latest: \`${IMAGE}:latest\`"
            echo "- Immutable workflow: ${RELEASE_RUN_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"
